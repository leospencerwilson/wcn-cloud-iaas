# Monitoring stack for the internal Proxmox VM `wcn-monitor` (10.10.30.20, VLAN 30 / DMZ).
#
# Internal-only. Exposed via Cloudflare Tunnel + Cloudflare Access (see phase 6) —
# no public TLS termination needed on this VM.
#
# Hostnames (behind CF Access):
#   kuma.western-communication.com   — Uptime Kuma admin
#   grafana.western-communication.com — Grafana (added in phase 6)
#
# External liveness alerting is NOT this stack — it's Cloudflare Health Checks
# at the account level (see phase 1 § 1.5c). This stack is for ops trend data only.
#
# Deploy:
#   ssh ops@$MONITOR_VM_IP    # 10.10.30.20
#   cd ~/monitor
#   docker compose pull
#   docker compose up -d

services:

  kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - kuma_data:/app/data
    ports: ["3001:3001"]   # bound on the VM; reached via SSH tunnel or CF Tunnel

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PW}
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=Cf-Access-Authenticated-User-Email
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
    volumes:
      - grafana_data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  kuma_data:
  prometheus_data:
  grafana_data:

# Public status page is deferred to phase 6 — see ARCHITECTURE.md.
# Two options when implementing: Cloudflare Pages (static, regenerated by Kuma → CF API)
# or external SaaS (BetterStack, Statuspage).
#
# .env file alongside (chmod 600):
# ─────────────────────────────────
# GRAFANA_ADMIN_PW=<random 32-char>
