# Telegraf config installed on each customer VM (and the ops VM).
# Forwards metrics to the internal `wcn-monitor` VM (10.10.30.20).
#
# Note: monitor-compose.yml currently ships Prometheus + Grafana, not InfluxDB.
# If staying with telegraf, either add InfluxDB to the monitor stack, or change
# the output below to [[outputs.prometheus_client]] and have Prometheus scrape.
# Decision deferred to phase 6.
#
# Install:
#   apt install -y telegraf
#   cp telegraf.conf /etc/telegraf/telegraf.conf
#   systemctl enable --now telegraf
#
# The customer.env's SLUG is read at agent startup and tagged on every metric.

[global_tags]
  customer_slug = "$SLUG"
  tier          = "$TIER"

[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "60s"
  hostname = "wcn-cloud-$SLUG"
  omit_hostname = false

# ── outputs ────────────────────────────────────────────────────────
[[outputs.influxdb_v2]]
  urls = ["http://10.10.30.20:8086"]   # internal wcn-monitor VM (InfluxDB, if added)
  token = "$TELEGRAF_TOKEN"
  organization = "wcn"
  bucket = "wcn-cloud"

# ── inputs ─────────────────────────────────────────────────────────
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.mem]]
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]
[[inputs.diskio]]
[[inputs.net]]
  interfaces = ["eth0", "ens18"]
  ignore_protocol_stats = true
[[inputs.system]]

# ── Docker (for our containers) ────────────────────────────────────
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  total = false
  perdevice = false
  perdevice_include = []
  total_include = ["cpu", "blkio", "network"]

# ── Coolify health ─────────────────────────────────────────────────
[[inputs.http]]
  urls = ["http://localhost:8000/api/health"]
  method = "GET"
  timeout = "5s"
  data_format = "json_v2"
  [[inputs.http.json_v2]]
    measurement_name = "coolify_health"
    [[inputs.http.json_v2.field]]
      path = "status"

# ── Caddy /metrics (Prometheus) ────────────────────────────────────
[[inputs.prometheus]]
  urls = ["http://localhost:2019/metrics"]
  metric_version = 2
  namepass = ["caddy_*"]
